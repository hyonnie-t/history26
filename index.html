<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학기 역사 학습 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ══════════════ 디자인 토큰 ══════════════ */
:root{
  --paper:#F6F3EB;        /* 배접지 */
  --ink:#23262C;          /* 먹 */
  --ink-soft:#5A5F6A;
  --indigo:#2E4A7A;       /* 쪽빛 — 주 색 */
  --indigo-deep:#1F3457;
  --seal:#B03A2E;         /* 낙관 인주색 */
  --jade:#3E7C59;         /* 완료 보조 */
  --ochre:#C9972E;        /* 달성 강조 */
  --line:#D9D3C4;
  --card:#FFFFFF;
  --radius:14px;
  --shadow:0 2px 10px rgba(35,38,44,.07);
  --font-display:'Gowun Batang', serif;
  --font-body:'Pretendard', -apple-system, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  line-height:1.6;
}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--indigo); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important;}
}

/* ══════════════ 로그인 화면 ══════════════ */
#loginView{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-box{
  width:100%; max-width:420px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:40px 32px;
}
.login-eyebrow{
  font-size:.85rem; letter-spacing:.35em; color:var(--indigo);
  text-transform:uppercase; margin-bottom:8px; font-weight:600;
}
.login-title{
  font-family:var(--font-display); font-size:1.9rem; font-weight:700;
  line-height:1.3; margin-bottom:4px;
}
.login-sub{color:var(--ink-soft); font-size:.95rem; margin-bottom:28px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:.9rem; font-weight:600; margin-bottom:6px;}
.field input{
  width:100%; min-height:52px; font-size:1.1rem; padding:12px 16px;
  border:1.5px solid var(--line); border-radius:10px; background:#FCFBF7;
  font-family:var(--font-body); color:var(--ink);
}
.field input:focus{border-color:var(--indigo); outline:none; box-shadow:0 0 0 3px rgba(46,74,122,.15);}
.field .hint{font-size:.82rem; color:var(--ink-soft); margin-top:4px;}
.btn-primary{
  width:100%; min-height:54px; font-size:1.1rem; font-weight:700;
  background:var(--indigo); color:#fff; border:none; border-radius:10px;
  transition:background .15s;
}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-primary:disabled{background:#9AA3B2; cursor:wait;}
.login-error{
  margin-top:14px; padding:12px 14px; border-radius:8px;
  background:#FBEAE8; color:var(--seal); font-size:.92rem; display:none;
}

/* ══════════════ 포털 화면 ══════════════ */
#portalView{display:none; max-width:760px; margin:0 auto; padding:24px 20px 80px;}
.portal-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin-bottom:6px; flex-wrap:wrap;
}
.portal-eyebrow{font-size:.8rem; letter-spacing:.3em; color:var(--indigo); font-weight:600;}
.portal-title{font-family:var(--font-display); font-size:1.7rem; font-weight:700;}
.student-chip{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:8px 8px 8px 16px; font-size:.95rem; box-shadow:var(--shadow);
}
.student-chip strong{font-weight:700;}
.btn-logout{
  min-height:36px; padding:6px 14px; font-size:.85rem;
  background:var(--paper); border:1px solid var(--line); border-radius:999px; color:var(--ink-soft);
}
.btn-logout:hover{border-color:var(--ink-soft);}

/* 진행률 */
.progress-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px 24px; margin:20px 0 8px;
}
.progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.progress-label{font-size:.95rem; font-weight:600; color:var(--ink-soft);}
.progress-num{font-family:var(--font-display); font-size:1.6rem; font-weight:700; color:var(--indigo);}
.progress-num small{font-size:.9rem; color:var(--ink-soft); font-family:var(--font-body); font-weight:400;}
.progress-track{height:12px; background:var(--paper); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.progress-fill{
  height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg, var(--indigo), var(--ochre));
  transition:width .6s ease;
}

/* 선생님 피드백 */
.feedback-card{
  background:#FFF9EC; border:1px solid #EAD9A8; border-radius:var(--radius);
  padding:18px 22px; margin:14px 0; display:none;
}
.feedback-card h2{
  font-family:var(--font-display); font-size:1.05rem; margin-bottom:10px; color:#8A6A14;
}
.feedback-item{padding:10px 0; border-top:1px dashed #EAD9A8; font-size:.95rem;}
.feedback-item:first-of-type{border-top:none; padding-top:0;}
.feedback-item .fb-meta{font-size:.8rem; color:var(--ink-soft); margin-bottom:2px;}

/* ══════════════ 연표 (시그니처) ══════════════ */
.timeline{position:relative; margin-top:28px; padding-left:34px;}
.timeline::before{
  content:''; position:absolute; left:11px; top:8px; bottom:8px;
  width:2px; background:var(--line);
}
.lesson{position:relative; margin-bottom:18px;}
.lesson::before{ /* 연표 노드 */
  content:''; position:absolute; left:-30px; top:26px;
  width:12px; height:12px; border-radius:50%;
  background:var(--paper); border:2.5px solid var(--ink-soft);
}
.lesson.done::before{background:var(--jade); border-color:var(--jade);}
.lesson.pending-build::before{border-style:dashed; border-color:var(--line);}

.lesson-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px 22px; position:relative; overflow:hidden;
}
.lesson.pending-build .lesson-card{opacity:.62; background:#FBFAF5;}
.lesson-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.lesson-info{min-width:0;}
.lesson-type{
  display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.06em;
  padding:3px 10px; border-radius:999px; margin-bottom:8px;
  background:rgba(46,74,122,.1); color:var(--indigo);
}
.lesson-type.t-padlet{background:rgba(62,124,89,.12); color:var(--jade);}
.lesson-type.t-link{background:rgba(201,151,46,.14); color:#8A6A14;}
.lesson-title{
  font-family:var(--font-display); font-size:1.2rem; font-weight:700; line-height:1.4;
}
.lesson-desc{font-size:.92rem; color:var(--ink-soft); margin-top:4px;}

/* 낙관 도장 */
.seal-stamp{
  flex-shrink:0; width:56px; height:56px; border-radius:8px;
  border:2.5px solid var(--seal); color:var(--seal);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:1.5rem; font-weight:700;
  transform:rotate(-6deg);
  background:
    radial-gradient(circle at 30% 30%, rgba(176,58,46,.12), transparent 60%),
    rgba(176,58,46,.05);
  box-shadow:inset 0 0 0 1px rgba(176,58,46,.25);
  animation:stampIn .35s ease-out;
}
@keyframes stampIn{
  0%{transform:rotate(-6deg) scale(1.6); opacity:0;}
  100%{transform:rotate(-6deg) scale(1); opacity:1;}
}

/* 달성도 */
.achieve{
  display:flex; align-items:center; gap:8px; margin-top:14px;
  padding-top:12px; border-top:1px dashed var(--line);
  font-size:.9rem; color:var(--ink-soft);
}
.achieve .dots{letter-spacing:2px; font-size:1rem; color:var(--ochre);}
.achieve-summary{
  margin-top:8px; font-size:.9rem; color:var(--ink-soft);
  background:var(--paper); border-radius:8px; padding:10px 14px;
}

/* 카드 하단 액션 */
.lesson-actions{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;}
.btn-go{
  min-height:46px; padding:10px 22px; font-size:1rem; font-weight:700;
  background:var(--indigo); color:#fff; border:none; border-radius:10px;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.btn-go:hover{background:var(--indigo-deep);}
.btn-check{
  min-height:46px; padding:10px 20px; font-size:.95rem; font-weight:600;
  background:var(--card); color:var(--jade); border:1.5px solid var(--jade); border-radius:10px;
}
.btn-check:hover{background:rgba(62,124,89,.08);}
.btn-check:disabled{opacity:.5; cursor:wait;}
.badge-wait{
  display:inline-block; font-size:.85rem; color:var(--ink-soft);
  padding:8px 14px; border:1px dashed var(--line); border-radius:10px;
}

/* 상태 메시지 */
.status-line{margin-top:22px; text-align:center; color:var(--ink-soft); font-size:.95rem; display:none;}
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px;
  font-size:.95rem; box-shadow:0 4px 16px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:opacity .25s;
  max-width:90vw; text-align:center;
}
.toast.show{opacity:1;}

/* 포인트·칭호 */
.rank-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); flex-wrap:wrap;
}
.rank-badge{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(46,74,122,.08); border:1px solid rgba(46,74,122,.25);
  color:var(--indigo); border-radius:999px; padding:6px 16px;
  font-weight:700; font-size:.95rem;
}
.rank-points{font-family:var(--font-display); font-size:1.1rem; color:var(--ochre); font-weight:700;}
.rank-next{font-size:.85rem; color:var(--ink-soft);}

/* 달성도 모아보기 */
.overview-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 22px; margin:14px 0; display:none;
}
.overview-card h2{font-family:var(--font-display); font-size:1.05rem; margin-bottom:10px;}
.overview-item{
  display:flex; align-items:center; gap:10px; padding:8px 0;
  border-top:1px dashed var(--line); font-size:.93rem;
}
.overview-item:first-of-type{border-top:none; padding-top:0;}
.overview-item .dots{letter-spacing:2px; color:var(--ochre); flex-shrink:0;}
.overview-item .ov-title{font-weight:600;}

/* 재도전 배지 */
.retry-hint{
  margin-top:8px; font-size:.85rem; color:var(--indigo);
  background:rgba(46,74,122,.07); border-radius:8px; padding:8px 12px;
}

@media (max-width:480px){
  .login-box{padding:32px 22px;}
  #portalView{padding:18px 14px 70px;}
  .lesson-card{padding:16px 16px;}
  .seal-stamp{width:48px; height:48px; font-size:1.3rem;}
}

/* ══════════════ 교사 대시보드 ══════════════ */
.teacher-entry{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); text-align:center;}
.teacher-link{background:none; border:none; color:var(--ink-soft); font-size:.88rem; text-decoration:underline; padding:8px;}
.teacher-link:hover{color:var(--indigo);}
#teacherGate{display:none; margin-top:12px; text-align:left;}
#teacherGate input{width:100%; min-height:48px; font-size:1rem; padding:10px 14px;
  border:1.5px solid var(--line); border-radius:10px; background:#FCFBF7; margin-bottom:10px;}
#teacherGate input:focus{border-color:var(--indigo); outline:none;}
.gate-error{color:var(--seal); font-size:.88rem; margin-top:8px; display:none;}

#dashView{display:none; max-width:1100px; margin:0 auto; padding:22px 20px 80px;}
.btn{min-height:46px; padding:10px 20px; font-size:.95rem; font-weight:700;
  background:var(--indigo); color:#fff; border:none; border-radius:10px;}
.btn:hover{background:var(--indigo-deep);}
.btn:disabled{background:#9AA3B2; cursor:wait;}
.btn-ghost{background:var(--card); color:var(--ink-soft); border:1px solid var(--line); font-weight:600;}
.btn-ghost:hover{background:var(--paper); color:var(--ink);}
.btn-sm{min-height:38px; padding:6px 14px; font-size:.86rem;}
.dash-top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.dash-top h1{font-family:var(--font-display); font-size:1.5rem;}
.dash-top .eyebrow{font-size:.78rem; letter-spacing:.28em; color:var(--indigo); font-weight:600;}
.top-actions{display:flex; gap:8px;}
.filters{display:flex; gap:10px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; align-items:center;}
.filters label{font-size:.88rem; font-weight:600; color:var(--ink-soft);}
.filters select{min-height:42px; font-size:.93rem; padding:8px 12px; border:1.5px solid var(--line);
  border-radius:8px; background:#FCFBF7; font-family:inherit;}
.filters .spacer{flex:1;}
.summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; margin-bottom:14px;}
.sum-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px;}
.sum-card h3{font-size:.85rem; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.sum-card .big{font-family:var(--font-display); font-size:1.7rem; font-weight:700; color:var(--indigo);}
.sum-card .big small{font-size:.9rem; font-family:var(--font-body); color:var(--ink-soft); font-weight:400;}
.dist-bar{display:flex; height:14px; border-radius:999px; overflow:hidden; margin:8px 0 6px; border:1px solid var(--line);}
.dist-sang{background:var(--ochre);} .dist-jung{background:var(--indigo);} .dist-ha{background:#B9BFC9;}
.dist-legend{display:flex; gap:12px; font-size:.82rem; color:var(--ink-soft); flex-wrap:wrap;}
.dist-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px;}
.tag-list{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.tag-chip{font-size:.82rem; background:rgba(46,74,122,.08); color:var(--indigo);
  border-radius:999px; padding:3px 11px; font-weight:600;}
.tag-chip small{color:var(--ink-soft); font-weight:400;}
.table-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow-x:auto;}
.table-wrap table{width:100%; border-collapse:collapse; font-size:.9rem; min-width:640px;}
.table-wrap th{position:sticky; top:0; background:#F0EDE3; text-align:left; padding:11px 14px;
  font-size:.82rem; color:var(--ink-soft); border-bottom:1.5px solid var(--line); white-space:nowrap;}
.table-wrap td{padding:10px 14px; border-bottom:1px solid #EEEBE1; vertical-align:middle;}
tr.student-row{cursor:pointer;}
tr.student-row:hover td{background:#FBFAF4;}
.tbl-dots{letter-spacing:2px; color:var(--ochre); white-space:nowrap;}
.muted{color:#B0B5BE;}
.prog-mini{display:inline-flex; align-items:center; gap:8px;}
.prog-mini .track{width:70px; height:8px; background:var(--paper); border:1px solid var(--line);
  border-radius:999px; overflow:hidden;}
.prog-mini .fill{height:100%; background:linear-gradient(90deg, var(--indigo), var(--ochre)); display:block;}
.fb-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--jade); margin-left:6px;}
tr.detail-row td{background:#FBFAF5; padding:16px 18px;}
.rec{border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px 14px; margin-bottom:10px; font-size:.9rem;}
.rec .rec-head{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.rec .rec-title{font-weight:700;}
.rec .rec-meta{color:var(--ink-soft); font-size:.83rem;}
.rec dl{display:grid; grid-template-columns:88px 1fr; gap:4px 10px;}
.rec dt{color:var(--ink-soft); font-size:.83rem;}
.rec dd{word-break:break-word;}
.fb-history{margin:10px 0;}
.fb-history .fb-item{font-size:.88rem; padding:8px 12px; background:#FFF9EC;
  border:1px solid #EAD9A8; border-radius:8px; margin-bottom:6px;}
.fb-item .fb-meta{font-size:.78rem; color:var(--ink-soft);}
.fb-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; margin-top:8px;}
.fb-form select{min-height:42px; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:#FCFBF7; font-family:inherit; font-size:.9rem;}
.fb-form textarea{flex:1; min-width:220px; min-height:42px; padding:10px 12px;
  border:1.5px solid var(--line); border-radius:8px; background:#FCFBF7; font-family:inherit; font-size:.92rem; resize:vertical;}
.empty-line{padding:28px; text-align:center; color:var(--ink-soft);}
@media (max-width:600px){ #dashView{padding:16px 10px 60px;} }

</style>
</head>
<body>

<!-- ══════════════ 로그인 ══════════════ -->
<div id="loginView">
  <div class="login-box">
    <p class="login-eyebrow">2026 · 2학기</p>
    <h1 class="login-title">역사 학습 포털</h1>
    <p class="login-sub">학번과 이름을 입력하면 내 학습 기록이 열려요.</p>
    <div class="field">
      <label for="inputId">학번</label>
      <input id="inputId" type="text" inputmode="numeric" maxlength="5" placeholder="예: 30512" autocomplete="off">
      <p class="hint">학년·반·번호 5자리 (3학년 5반 12번 → 30512)</p>
    </div>
    <div class="field">
      <label for="inputName">이름</label>
      <input id="inputName" type="text" placeholder="이름을 입력하세요" autocomplete="off">
    </div>
    <button class="btn-primary" id="btnLogin">내 기록 열기</button>
    <div class="login-error" id="loginError"></div>
    <div class="teacher-entry">
      <button class="teacher-link" id="btnTeacherMode">🔑 교사용 대시보드</button>
      <div id="teacherGate">
        <input id="tokenInput" type="password" placeholder="교사 토큰" autocomplete="off">
        <button class="btn-primary" id="btnGate">대시보드 열기</button>
        <p class="gate-error" id="gateError"></p>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ 포털 ══════════════ -->
<div id="portalView">
  <header class="portal-header">
    <div>
      <p class="portal-eyebrow" id="portalEyebrow">2학기 · 역사</p>
      <h1 class="portal-title" id="portalTitle">나의 학습 연표</h1>
    </div>
    <div class="student-chip">
      <span id="chipText"><strong>—</strong></span>
      <button class="btn-logout" id="btnLogout">나가기</button>
    </div>
  </header>

  <section class="progress-card" aria-label="진행률">
    <div class="progress-top">
      <span class="progress-label">진행률</span>
      <span class="progress-num"><span id="progressPct">0</span>%
        <small>(<span id="progressDone">0</span>/<span id="progressTotal">0</span> 차시)</small>
      </span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="rank-row">
      <span class="rank-badge">🏷️ <span id="rankName">견습 사관</span></span>
      <span class="rank-points">탐구 포인트 <span id="pointsNum">0</span>점</span>
      <span class="rank-next" id="rankNext"></span>
    </div>
  </section>

  <section class="overview-card" id="overviewCard" aria-label="나의 달성도">
    <h2>📜 나의 달성도</h2>
    <div id="overviewList"></div>
  </section>

  <section class="feedback-card" id="feedbackCard" aria-label="선생님 피드백">
    <h2>📮 선생님이 남긴 피드백</h2>
    <div id="feedbackList"></div>
  </section>

  <div class="timeline" id="timeline"></div>
  <p class="status-line" id="statusLine"></p>
</div>

<!-- ══════════════ 교사 대시보드 ══════════════ -->
<div id="dashView">
  <div class="dash-top">
    <div>
      <p class="eyebrow">2학기 · 통합 학습 포털</p>
      <h1>교사 대시보드</h1>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost btn-sm" id="btnCsv">CSV 다운로드</button>
      <button class="btn btn-ghost btn-sm" id="btnDashRefresh">새로고침</button>
      <button class="btn btn-ghost btn-sm" id="btnDashOut">나가기</button>
    </div>
  </div>

  <div class="filters">
    <label for="selGrade">학년</label>
    <select id="selGrade"></select>
    <label for="selBan">반</label>
    <select id="selBan"></select>
    <label for="selActivity">활동</label>
    <select id="selActivity"></select>
    <span class="spacer"></span>
    <span id="rowCount" style="font-size:.85rem;color:var(--ink-soft);"></span>
  </div>

  <div class="summary">
    <div class="sum-card">
      <h3>기록이 있는 학생</h3>
      <div class="big"><span id="sumStudents">0</span><small>명</small></div>
    </div>
    <div class="sum-card">
      <h3>평균 진행률</h3>
      <div class="big"><span id="sumProgress">0</span><small>%</small></div>
    </div>
    <div class="sum-card">
      <h3>성취수준 분포 <small id="distScope"></small></h3>
      <div class="dist-bar" id="distBar"></div>
      <div class="dist-legend">
        <span><i class="dist-sang"></i>상 <b id="cntSang">0</b></span>
        <span><i class="dist-jung"></i>중 <b id="cntJung">0</b></span>
        <span><i class="dist-ha"></i>하 <b id="cntHa">0</b></span>
      </div>
    </div>
    <div class="sum-card">
      <h3>분류태그 상위</h3>
      <div class="tag-list" id="tagList"><span class="muted">—</span></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* 설정은 config.js에서 불러옵니다 (같은 폴더에 있어야 함) */
const CONFIG = window.PORTAL_CONFIG;
if (!CONFIG) {
  document.body.innerHTML = '<div style="max-width:420px;margin:80px auto;padding:24px;font-family:sans-serif;line-height:1.6">'
    + '<h2>config.js를 찾을 수 없어요</h2>'
    + '<p>config.js 파일이 이 HTML과 같은 폴더에 있는지 확인해 주세요.</p></div>';
  throw new Error('config.js 없음');
}

/* ════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
let SESSION = null;      // { studentId, name, grade, ban, num }
let STUDENT_DATA = null; // 서버 응답 { activities, feedback }

/* ── 저장소 (미리보기 환경 대비 try/catch) ── */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ── 학번 파싱: 30512 → 3학년 5반 12번 ── */
function parseStudentId(sid){
  if(!/^\d{5}$/.test(sid)) return null;
  return { grade: Number(sid[0]), ban: Number(sid.slice(1,3)), num: Number(sid.slice(3,5)) };
}

/* ── 로그인 ── */
async function login(sid, name, silent){
  const parsed = parseStudentId(sid);
  const err = $('loginError');
  if(!parsed){ showLoginError("학번은 숫자 5자리예요. 예: 30512"); return; }
  if(!name){ showLoginError("이름을 입력해 주세요."); return; }
  if(!CONFIG.CURRICULUM[parsed.grade]){
    showLoginError("이 학번의 학년 정보를 찾을 수 없어요. 학번을 다시 확인해 주세요."); return;
  }

  const btn = $('btnLogin');
  btn.disabled = true; btn.textContent = "기록을 불러오는 중…";
  err.style.display = 'none';

  try{
    const url = CONFIG.WEBAPP_URL
      + "?mode=student&studentId=" + encodeURIComponent(sid)
      + "&name=" + encodeURIComponent(name);
    const res = await fetch(url);
    const data = await res.json();
    if(data.result !== 'success') throw new Error(data.message || '조회 실패');

    SESSION = { studentId: sid, name, ...parsed };
    STUDENT_DATA = data;
    store.set('portal_session', JSON.stringify({ sid, name }));
    renderPortal();
  }catch(e){
    if(silent){ /* 자동 로그인 실패는 조용히 로그인 화면 유지 */ }
    else showLoginError("기록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
  }finally{
    btn.disabled = false; btn.textContent = "내 기록 열기";
  }
}

function showLoginError(msg){
  const err = $('loginError');
  err.textContent = msg; err.style.display = 'block';
}

/* ── 포털 렌더 ── */
function renderPortal(){
  const cur = CONFIG.CURRICULUM[SESSION.grade];
  $('loginView').style.display = 'none';
  $('portalView').style.display = 'block';

  $('portalEyebrow').textContent = `2학기 · ${SESSION.grade}학년 ${cur.subject}`;
  $('chipText').innerHTML =
    `<strong>${escapeHtml(SESSION.name)}</strong>&nbsp;· ${SESSION.grade}학년 ${SESSION.ban}반 ${SESSION.num}번`;

  const doneIds = new Set(STUDENT_DATA.activities.map(a => String(a.activityId)));
  // 활동별 성취 기록: "성취수준이 있는 가장 최근 기록"을 우선.
  // (재도전 직후 아직 AI 분석 전인 행이 마지막이어도, 이전 분석 결과를 유지)
  const achieveMap = {};
  STUDENT_DATA.activities.forEach(a => {
    const id = String(a.activityId);
    const prev = achieveMap[id];
    const hasA = a.achievement && String(a.achievement).trim();
    const prevHasA = prev && prev.achievement && String(prev.achievement).trim();
    if (!prev || hasA || !prevHasA) achieveMap[id] = a;
  });

  // 진행률: url이 있는(열려 있는) 차시만 분모로
  const active = cur.lessons.filter(l => l.url);
  const doneCount = active.filter(l => doneIds.has(l.id)).length;
  const pct = active.length ? Math.round(doneCount / active.length * 100) : 0;
  $('progressPct').textContent = pct;
  $('progressDone').textContent = doneCount;
  $('progressTotal').textContent = active.length;
  requestAnimationFrame(() => { $('progressFill').style.width = pct + '%'; });

  // 탐구 포인트 & 칭호 (참여 기반 — 달성도와 무관)
  const doneLessons = cur.lessons.filter(l => doneIds.has(l.id));
  const points = doneLessons.length * CONFIG.POINTS_PER_LESSON;
  let rank = CONFIG.RANKS[0], nextRank = null;
  CONFIG.RANKS.forEach(r => { if (points >= r.min) rank = r; });
  nextRank = CONFIG.RANKS.find(r => r.min > points) || null;
  $('pointsNum').textContent = points;
  $('rankName').textContent = rank.name;
  $('rankNext').textContent = nextRank
    ? `다음 칭호(${nextRank.name})까지 ${nextRank.min - points}점`
    : '최고 칭호에 도달했어요!';

  // 나의 달성도 모아보기 (분석된 활동이 1개 이상일 때만 표시)
  const analyzed = cur.lessons
    .map(l => ({ lesson: l, rec: achieveMap[l.id] }))
    .filter(x => x.rec && x.rec.achievement && String(x.rec.achievement).trim());
  if (analyzed.length) {
    $('overviewCard').style.display = 'block';
    $('overviewList').innerHTML = analyzed.map(x => `
      <div class="overview-item">
        <span class="dots">${achieveDots(x.rec.achievement)}</span>
        <span class="ov-title">${escapeHtml(x.lesson.title)}</span>
      </div>`).join('');
  } else {
    $('overviewCard').style.display = 'none';
  }

  // 피드백
  const fb = STUDENT_DATA.feedback || [];
  if(fb.length){
    $('feedbackCard').style.display = 'block';
    $('feedbackList').innerHTML = fb.map(f => `
      <div class="feedback-item">
        <div class="fb-meta">${formatDate(f.timestamp)} · ${escapeHtml(f.activityId)}</div>
        <div>${escapeHtml(f.feedback)}</div>
      </div>`).join('');
  } else {
    $('feedbackCard').style.display = 'none';
  }

  // 연표
  const tl = $('timeline');
  if(cur.lessons.length === 0){
    tl.innerHTML = '';
    $('statusLine').style.display = 'block';
    $('statusLine').textContent = "이번 학기 활동이 준비되면 여기에 하나씩 나타나요.";
    return;
  }
  $('statusLine').style.display = 'none';

  tl.innerHTML = cur.lessons.map((l, i) => {
    const done = doneIds.has(l.id);
    const building = !l.url;
    const rec = achieveMap[l.id];
    const typeLabel = { module:"탐구 활동", padlet:"패들렛 글쓰기", link:"외부 활동" }[l.type] || "활동";
    const typeClass = { padlet:"t-padlet", link:"t-link" }[l.type] || "";

    let achieveHtml = '';
    if(done && rec && rec.achievement){
      achieveHtml = `
        <div class="achieve">
          <span>달성도</span>
          <span class="dots">${achieveDots(rec.achievement)}</span>
          <span>${escapeHtml(String(rec.achievement))}</span>
        </div>
        ${rec.summary ? `<div class="achieve-summary">💬 ${escapeHtml(String(rec.summary))}</div>` : ''}
        ${(!building && ['중','하'].includes(String(rec.achievement).trim()))
          ? `<div class="retry-hint">🔄 다시 도전하면 달성도가 새로 기록돼요</div>` : ''}`;
    }

    let actions = '';
    if(building){
      actions = `<span class="badge-wait">🔨 준비 중이에요</span>`;
    } else if(l.type === 'module'){
      actions = `<a class="btn-go" href="${withStudentParams(l.url)}" target="_blank" rel="noopener">
        ${done ? "다시 하러 가기" : "하러 가기"} →</a>`;
    } else {
      actions = `<a class="btn-go" href="${l.url}" target="_blank" rel="noopener">활동 열기 →</a>`
        + (done ? '' : `<button class="btn-check" data-lesson="${escapeHtml(l.id)}">활동을 끝냈어요 ✓</button>`);
    }

    return `
      <div class="lesson ${done ? 'done' : ''} ${building ? 'pending-build' : ''}">
        <div class="lesson-card">
          <div class="lesson-top">
            <div class="lesson-info">
              <span class="lesson-type ${typeClass}">${i+1}차시 · ${typeLabel}</span>
              <h2 class="lesson-title">${escapeHtml(l.title)}</h2>
              ${l.desc ? `<p class="lesson-desc">${escapeHtml(l.desc)}</p>` : ''}
            </div>
            ${done ? `<div class="seal-stamp" aria-label="완료">완</div>` : ''}
          </div>
          ${achieveHtml}
          <div class="lesson-actions">${actions}</div>
        </div>
      </div>`;
  }).join('');

  // 자가체크 버튼 이벤트
  tl.querySelectorAll('.btn-check').forEach(btn => {
    btn.addEventListener('click', () => selfCheck(btn));
  });
}

/* ── 자가체크 (패들렛·외부 활동) ── */
async function selfCheck(btn){
  const lessonId = btn.dataset.lesson;
  btn.disabled = true; btn.textContent = "기록하는 중…";
  try{
    await fetch(CONFIG.WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({
        studentId: SESSION.studentId,
        studentName: SESSION.name,
        gameName: lessonId,
        choiceSummary: '자가체크'
      })
    });
    // 서버 반영을 로컬에도 즉시 반영
    STUDENT_DATA.activities.push({ activityId: lessonId, achievement:'', summary:'', timestamp:new Date().toISOString() });
    showToast("완료로 기록했어요! 도장이 찍혔어요 🎉");
    renderPortal();
  }catch(e){
    btn.disabled = false; btn.textContent = "활동을 끝냈어요 ✓";
    showToast("기록하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
  }
}

/* ── 활동 페이지로 학번·이름 전달 ── */
function withStudentParams(url){
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 'sid=' + encodeURIComponent(SESSION.studentId)
             + '&name=' + encodeURIComponent(SESSION.name);
}

/* ── 유틸 ── */
function achieveDots(level){
  const l = String(level).trim();
  if(l === '상') return '●●●';
  if(l === '중') return '●●○';
  if(l === '하') return '●○○';
  return '○○○';
}
function formatDate(ts){
  const d = new Date(ts);
  if(isNaN(d)) return '';
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ── 이벤트 바인딩 ── */
$('btnLogin').addEventListener('click', () => {
  login($('inputId').value.trim(), $('inputName').value.trim(), false);
});
$('inputName').addEventListener('keydown', e => {
  if(e.key === 'Enter') $('btnLogin').click();
});
$('btnLogout').addEventListener('click', () => {
  store.del('portal_session');
  SESSION = null; STUDENT_DATA = null;
  $('portalView').style.display = 'none';
  $('loginView').style.display = 'flex';
  $('inputId').value = ''; $('inputName').value = '';
});

/* ════════════════════════════════════════════════════════
 * 교사 대시보드
 * ════════════════════════════════════════════════════════ */
let TOKEN = '';
let ROWS = [];
let FEEDBACKS = [];
let openDetailSid = null;

async function dashLoadData(){
  const base = CONFIG.WEBAPP_URL;
  const [r1, r2] = await Promise.all([
    fetch(base + '?token=' + encodeURIComponent(TOKEN)).then(r=>r.json()),
    fetch(base + '?mode=feedback&token=' + encodeURIComponent(TOKEN)).then(r=>r.json())
  ]);
  if(r1.result === 'error') throw new Error(r1.message);
  ROWS = (r1.rows || []).filter(r => parseStudentId(String(r.studentId)));
  FEEDBACKS = (r2.rows || []);
}

async function enterDash(token){
  TOKEN = token;
  const btn = $('btnGate'); btn.disabled = true; btn.textContent = '확인 중…';
  $('gateError').style.display = 'none';
  try{
    await dashLoadData();
    store.set('dash_token', token);
    $('loginView').style.display = 'none';
    $('portalView').style.display = 'none';
    $('dashView').style.display = 'block';
    dashInitFilters();
    renderDash();
  }catch(e){
    $('gateError').textContent = '들어가지 못했어요: ' + e.message;
    $('gateError').style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = '대시보드 열기';
  }
}

function dashInitFilters(){
  const grades = Object.keys(CONFIG.CURRICULUM);
  $('selGrade').innerHTML = grades.map(g =>
    `<option value="${g}">${g}학년 ${CONFIG.CURRICULUM[g].subject}</option>`).join('');
  const withData = grades.find(g => ROWS.some(r => parseStudentId(String(r.studentId)).grade === Number(g)));
  if(withData) $('selGrade').value = withData;
  dashRefreshBanOptions();
  dashRefreshActivityOptions();
}
function dashRefreshBanOptions(){
  const grade = Number($('selGrade').value);
  const bans = [...new Set(ROWS.map(r => parseStudentId(String(r.studentId)))
    .filter(p => p.grade === grade).map(p => p.ban))].sort((a,b)=>a-b);
  $('selBan').innerHTML = '<option value="">전체 반</option>'
    + bans.map(b => `<option value="${b}">${b}반</option>`).join('');
}
function dashRefreshActivityOptions(){
  const grade = Number($('selGrade').value);
  const lessons = CONFIG.CURRICULUM[grade].lessons;
  $('selActivity').innerHTML = '<option value="">전체 활동</option>'
    + lessons.map(l => `<option value="${escapeHtml(l.id)}">${escapeHtml(l.title)}</option>`).join('');
}

function dashFilteredRows(){
  const grade = Number($('selGrade').value);
  const ban = $('selBan').value;
  const act = $('selActivity').value;
  return ROWS.filter(r => {
    const p = parseStudentId(String(r.studentId));
    if(p.grade !== grade) return false;
    if(ban && p.ban !== Number(ban)) return false;
    if(act && String(r.gameName) !== act) return false;
    return true;
  });
}

function renderDash(){
  const grade = Number($('selGrade').value);
  const ban = $('selBan').value;
  const act = $('selActivity').value;
  const lessons = CONFIG.CURRICULUM[grade].lessons;
  const activeLessons = lessons.filter(l => l.url);
  const rows = dashFilteredRows();

  const gradeRows = ROWS.filter(r => {
    const p = parseStudentId(String(r.studentId));
    return p.grade === grade && (!ban || p.ban === Number(ban));
  });
  const students = {};
  gradeRows.forEach(r => {
    const sid = String(r.studentId);
    if(!students[sid]) students[sid] = { sid, name:String(r.studentName||''), p:parseStudentId(sid), records:[] };
    students[sid].records.push(r);
  });
  const list = Object.values(students).sort((a,b) => a.p.ban - b.p.ban || a.p.num - b.p.num);

  list.forEach(s => {
    s.doneIds = new Set(s.records.map(r => String(r.gameName)));
    s.achieve = {};
    s.records.forEach(r => {
      const id = String(r.gameName);
      const lv = String(r['성취수준']||'').trim();
      const prev = s.achieve[id];
      if(!prev || lv || !String(prev['성취수준']||'').trim()) s.achieve[id] = r;
    });
    const done = activeLessons.filter(l => s.doneIds.has(l.id)).length;
    s.pct = activeLessons.length ? Math.round(done/activeLessons.length*100) : 0;
    s.doneCount = done;
    s.feedbacks = FEEDBACKS.filter(f => String(f.studentId).trim() === s.sid);
  });

  $('sumStudents').textContent = list.length;
  $('sumProgress').textContent = list.length
    ? Math.round(list.reduce((a,s)=>a+s.pct,0)/list.length) : 0;

  const cnt = { 상:0, 중:0, 하:0 };
  rows.forEach(r => { const l = String(r['성취수준']||'').trim(); if(cnt[l]!==undefined) cnt[l]++; });
  $('cntSang').textContent = cnt['상']; $('cntJung').textContent = cnt['중']; $('cntHa').textContent = cnt['하'];
  $('distScope').textContent = act ? '(선택한 활동)' : '(전체 활동)';
  const total = cnt['상']+cnt['중']+cnt['하'];
  $('distBar').innerHTML = total ?
    `<div class="dist-sang" style="width:${cnt['상']/total*100}%"></div>
     <div class="dist-jung" style="width:${cnt['중']/total*100}%"></div>
     <div class="dist-ha" style="width:${cnt['하']/total*100}%"></div>`
    : '<div style="width:100%;background:#EEE"></div>';

  const tagCnt = {};
  rows.forEach(r => { const t = String(r['분류태그']||'').trim(); if(t) tagCnt[t]=(tagCnt[t]||0)+1; });
  const topTags = Object.entries(tagCnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('tagList').innerHTML = topTags.length
    ? topTags.map(([t,n]) => `<span class="tag-chip">${escapeHtml(t)} <small>${n}</small></span>`).join('')
    : '<span class="muted">아직 분석된 태그가 없어요</span>';

  $('rowCount').textContent = `기록 ${rows.length}건`;

  $('tableHead').innerHTML = '<tr><th>학번</th><th>이름</th><th>진행률</th>'
    + lessons.map(l => `<th title="${escapeHtml(l.title)}">${escapeHtml(dashShorten(l.title, 8))}</th>`).join('')
    + '</tr>';

  if(!list.length){
    $('tableBody').innerHTML = `<tr><td colspan="${3+lessons.length}" class="empty-line">아직 이 조건에 해당하는 학생 기록이 없어요.</td></tr>`;
    return;
  }

  $('tableBody').innerHTML = list.map(s => {
    const cells = lessons.map(l => {
      if(!s.doneIds.has(l.id)) return '<td class="muted">—</td>';
      const rec = s.achieve[l.id];
      const lv = rec ? String(rec['성취수준']||'').trim() : '';
      return `<td><span class="tbl-dots" title="${escapeHtml(lv||'분석 전')}">${dashDots(lv)}</span></td>`;
    }).join('');
    return `
      <tr class="student-row" data-sid="${s.sid}">
        <td>${s.sid}</td>
        <td>${escapeHtml(s.name)}${s.feedbacks.length ? '<span class="fb-dot" title="피드백 있음"></span>' : ''}</td>
        <td><span class="prog-mini"><span class="track"><span class="fill" style="width:${s.pct}%"></span></span>${s.doneCount}/${activeLessons.length}</span></td>
        ${cells}
      </tr>
      ${openDetailSid === s.sid ? dashDetailRowHtml(s, lessons, 3+lessons.length) : ''}`;
  }).join('');

  document.querySelectorAll('tr.student-row').forEach(tr => {
    tr.addEventListener('click', () => {
      openDetailSid = (openDetailSid === tr.dataset.sid) ? null : tr.dataset.sid;
      renderDash();
    });
  });
  document.querySelectorAll('.fb-send').forEach(btn => {
    btn.addEventListener('click', ev => { ev.stopPropagation(); dashSendFeedback(btn); });
  });
  document.querySelectorAll('tr.detail-row').forEach(tr => {
    tr.addEventListener('click', ev => ev.stopPropagation());
  });
}

function dashDetailRowHtml(s, lessons, colspan){
  const act = $('selActivity').value;
  const recs = s.records
    .filter(r => !act || String(r.gameName) === act)
    .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

  const recHtml = recs.length ? recs.map(r => `
    <div class="rec">
      <div class="rec-head">
        <span class="rec-title">${escapeHtml(dashLessonTitle(String(r.gameName)))}</span>
        <span class="rec-meta">${formatDate(r.timestamp)} · 성취 ${escapeHtml(String(r['성취수준']||'분석 전'))}</span>
      </div>
      <dl>
        <dt>선택 요약</dt><dd>${escapeHtml(String(r.choiceSummary||'—'))}</dd>
        <dt>학생 서술</dt><dd>${escapeHtml(String(r.reflection||'—'))}</dd>
        <dt>1줄요약</dt><dd>${escapeHtml(String(r['1줄요약']||'—'))}</dd>
        <dt>판단근거</dt><dd>${escapeHtml(String(r['판단근거']||'—'))}</dd>
      </dl>
    </div>`).join('') : '<p class="muted" style="margin-bottom:10px">표시할 기록이 없어요.</p>';

  const fbHtml = s.feedbacks.length ? `<div class="fb-history">${
    s.feedbacks.map(f => `<div class="fb-item">
      <div class="fb-meta">${formatDate(f.timestamp)} · ${escapeHtml(dashLessonTitle(String(f.activityId)))}</div>
      ${escapeHtml(String(f.feedback))}</div>`).join('')}</div>` : '';

  const options = '<option value="전체">전체(학기 총평)</option>'
    + lessons.map(l => `<option value="${escapeHtml(l.id)}">${escapeHtml(l.title)}</option>`).join('');

  return `
    <tr class="detail-row"><td colspan="${colspan}">
      ${recHtml}
      ${fbHtml}
      <div class="fb-form">
        <select class="fb-activity">${options}</select>
        <textarea class="fb-text" placeholder="${escapeHtml(s.name)} 학생에게 보낼 피드백 — 학생 포털에 표시됩니다"></textarea>
        <button class="btn btn-sm fb-send" data-sid="${s.sid}" data-name="${escapeHtml(s.name)}">보내기</button>
      </div>
    </td></tr>`;
}

async function dashSendFeedback(btn){
  const wrap = btn.closest('.fb-form');
  const text = wrap.querySelector('.fb-text').value.trim();
  const activityId = wrap.querySelector('.fb-activity').value;
  if(!text){ showToast('피드백 내용을 입력해 주세요.'); return; }
  btn.disabled = true; btn.textContent = '보내는 중…';
  try{
    await fetch(CONFIG.WEBAPP_URL, {
      method:'POST',
      body: JSON.stringify({
        action:'feedback', token:TOKEN,
        studentId:btn.dataset.sid, studentName:btn.dataset.name,
        activityId, feedback:text
      })
    });
    FEEDBACKS.push({ timestamp:new Date().toISOString(), studentId:btn.dataset.sid,
      studentName:btn.dataset.name, activityId, feedback:text });
    showToast('피드백을 보냈어요. 학생 포털에 표시됩니다.');
    renderDash();
  }catch(e){
    btn.disabled = false; btn.textContent = '보내기';
    showToast('보내지 못했어요. 다시 시도해 주세요.');
  }
}

function dashDownloadCsv(){
  const rows = dashFilteredRows();
  if(!rows.length){ showToast('내려받을 기록이 없어요.'); return; }
  const cols = [
    ['타임스탬프', r=>{ const d=new Date(r.timestamp); return isNaN(d)?'':d.toLocaleString('ko-KR'); }],
    ['학번', r=>r.studentId], ['이름', r=>r.studentName],
    ['활동', r=>dashLessonTitle(String(r.gameName))], ['게임명(원본)', r=>r.gameName],
    ['선택 요약', r=>r.choiceSummary], ['실제 역사와의 차이', r=>r.diffSummary],
    ['학생 서술', r=>r.reflection],
    ['분류태그', r=>r['분류태그']||''], ['1줄요약', r=>r['1줄요약']||''],
    ['성취수준', r=>r['성취수준']||''], ['판단근거', r=>r['판단근거']||'']
  ];
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const csv = '\uFEFF' + cols.map(c=>esc(c[0])).join(',') + '\n'
    + rows.map(r => cols.map(c=>esc(c[1](r))).join(',')).join('\n');
  const grade = $('selGrade').value, ban = $('selBan').value;
  const name = `학습기록_${grade}학년${ban? '_'+ban+'반':''}_${new Date().toISOString().slice(0,10)}.csv`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function dashLessonTitle(id){
  for(const g of Object.keys(CONFIG.CURRICULUM)){
    const l = CONFIG.CURRICULUM[g].lessons.find(x => x.id === id);
    if(l) return l.title;
  }
  return id;
}
function dashDots(lv){ return lv==='상'?'●●●':lv==='중'?'●●○':lv==='하'?'●○○':'◌'; }
function dashShorten(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }

/* 대시보드 이벤트 */

  const g = $('teacherGate');

$('selBan').addEventListener('change', () => { openDetailSid=null; renderDash(); });
$('selActivity').addEventListener('change', () => renderDash());
$('btnCsv').addEventListener('click', dashDownloadCsv);

  showToast('새로고침 중…');
