<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>모둠 보기</title>
<link rel="icon" href="images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=130">
<style>
/* v150 — 로그인 없이 보는 확정 모둠. 대시보드 칠판 보기와 같은 모양, 같은 정보(반·모둠·번호)만. */
.gp-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:var(--space-md);}
.gp-tabs .btn{min-height:44px;}
.gp-title{font-size:1.5rem; margin:0 0 var(--space-sm); color:var(--indigo-deep);}
.gp-board{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:16px;}
.gp-col{border:2px solid var(--ink-soft); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; animation:gpIn .3s ease both; animation-delay:calc(var(--i) * .05s);}
.gp-head{background:var(--ink-soft); color:#fff; font-weight:700; font-size:1.3rem; padding:var(--space-xs) var(--space-sm);}
.gp-head small{font-weight:400; font-size:.8em;}
.gp-nos{display:flex; flex-wrap:wrap; gap:8px; padding:var(--space-sm);}
.gp-nos span{font-size:2.4rem; font-weight:700; min-width:1.6em; text-align:center; background:var(--paper); border-radius:var(--radius-xs);}
.gp-msg{color:var(--ink-soft);}
@keyframes gpIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){ .gp-col{animation:none;} }
</style>
</head>
<body class="pk-body">
<main class="pk-page">
  <header class="pk-head">
    <h1 class="pk-title">👥 모둠 보기</h1>
    <button type="button" class="btn btn-sm btn-ghost" id="gpReload">새로고침</button>
  </header>
  <div class="gp-tabs" id="gpTabs"></div>
  <section id="gpBox" aria-live="polite"><p class="gp-msg">불러오는 중…</p></section>
</main>
<script src="config.js?v=133"></script>
<script>
/* v150 — 교사 토큰 없이 확정 모둠을 본다(대시보드 로그인이 안 될 때). 백엔드 mode=groupsPublic은 효니 담당 반의 반·모둠·번호만 준다. 쓰기 없음.
 * config.js는 window.PORTAL_CONFIG만 만든다(CONFIG는 01-core-login.js 쪽 이름). */
(function(){
  const KEY = 'h26_groups_view_ban';
  const tabs = document.getElementById('gpTabs'), box = document.getElementById('gpBox'), reloadBtn = document.getElementById('gpReload');
  const has = key => Object.prototype.hasOwnProperty.call(groups, key);
  const byBan = (a, b) => { const x = a.split('-').map(Number), y = b.split('-').map(Number); return x[0] - y[0] || x[1] - y[1]; };
  let groups = {}, cur = '', loaded = false;
  const message = text => { box.textContent = ''; const p = document.createElement('p'); p.className = 'gp-msg'; p.textContent = text; box.appendChild(p); };
  const remember = key => { try { localStorage.setItem(KEY, key); } catch(e){ /* 기억만 못 할 뿐 */ } };
  const remembered = () => { try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } };
  function draw(){
    tabs.textContent = '';
    Object.keys(groups).sort(byBan).forEach(key => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-sm' + (key === cur ? '' : ' btn-ghost'); b.textContent = key + '반';
      b.setAttribute('aria-pressed', String(key === cur));
      b.onclick = () => { cur = key; remember(key); draw(); };
      tabs.appendChild(b);
    });
    if(!cur || !has(cur)){ message('아직 확정한 모둠이 없어요.'); return; }
    box.textContent = '';
    const h = document.createElement('h2'); h.className = 'gp-title'; h.textContent = cur + '반 모둠'; box.appendChild(h);
    const board = document.createElement('div'); board.className = 'gp-board';
    groups[cur].forEach((g, i) => {
      const col = document.createElement('div'); col.className = 'gp-col'; col.style.setProperty('--i', i);
      const head = document.createElement('div'); head.className = 'gp-head'; head.textContent = g.no + '모둠 ';
      const small = document.createElement('small'); small.textContent = g.nums.length + '명'; head.appendChild(small);
      const nos = document.createElement('div'); nos.className = 'gp-nos';
      g.nums.forEach(n => { const s = document.createElement('span'); s.textContent = n; nos.appendChild(s); });
      col.appendChild(head); col.appendChild(nos); board.appendChild(col);
    });
    box.appendChild(board);
  }
  /* 비상용 페이지라 일시 오류에 한 번 더 시도하고, 실패해도 이미 보이던 모둠은 지우지 않는다 */
  const fetchOnce = async () => { const res = await fetch(window.PORTAL_CONFIG.WEBAPP_URL + '?mode=groupsPublic'); return res.json(); };
  const notice = text => { if(!loaded){ tabs.textContent = ''; message(text); return; } let n = document.getElementById('gpNotice'); if(!n){ n = document.createElement('p'); n.id = 'gpNotice'; n.className = 'gp-msg'; box.prepend(n); } n.textContent = text; };
  async function load(){
    reloadBtn.disabled = true;
    try {
      let j;
      try { j = await fetchOnce(); } catch(e){ await new Promise(r => setTimeout(r, 800)); j = await fetchOnce(); }
      if(j.result !== 'success' || !j.groups || typeof j.groups !== 'object'){ notice('아직 준비 중이에요. 조금 뒤에 다시 열어 주세요.'); return; }
      groups = j.groups; loaded = true;
      const asked = new URLSearchParams(location.search).get('ban') || '';
      if(!has(cur)) cur = has(asked) ? asked : (has(remembered()) ? remembered() : Object.keys(groups).sort(byBan)[0] || '');
      draw();
    } catch(e){
      notice('불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.');
    } finally { reloadBtn.disabled = false; }
  }
  reloadBtn.onclick = load;
  load();
})();
</script>
</body>
</html>
