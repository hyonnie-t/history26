<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표자 뽑기</title>
<link rel="icon" href="images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=130">
<link rel="preload" as="image" href="images/cat/cat-down.jpg">
<link rel="preload" as="image" href="images/cat/cat-cheer.jpg">
</head>
<body class="pk-body">
<!-- v127 — 발표자 뽑기 별도 페이지. 교사 토큰 없이 교실 PC에서 바로 연다(즐겨찾기 예: picker.html?ban=2-1).
     번호만 다루고 서버에 쓰지 않는다. 로직은 js/picker.js. -->
<main class="pk-page">
  <header class="pk-head">
    <h1 class="pk-title">🎲 발표자 뽑기</h1>
    <button type="button" class="btn btn-sm btn-ghost" id="pkFullBtn">⛶ 전체 화면</button>
  </header>

  <section class="pk-card">
    <div class="pk-controls">
      <label for="pkClass" class="pk-label">반</label>
      <select id="pkClass" class="pk-select"></select>
      <button type="button" class="btn pk-draw" id="pkDrawBtn">뽑기</button>
    </div>
    <p class="pk-status" id="pkStatus"></p>
    <div class="pk-grid" id="pkGrid"></div>
    <p class="pk-desc">한 바퀴를 다 돌 때까지 이미 나온 번호는 다시 안 나와요. 결석한 학생은 번호를 눌러 빼 두세요(내일이면 풀려요). 스페이스·→·발표 리모컨으로도 뽑을 수 있어요.</p>
    <div class="pk-foot">
      <span class="pk-foot-left">
        <label class="pk-sound"><input type="checkbox" id="pkSound" checked> 소리</label>
        <!-- v129 — 고양이 테마: 뽑는 동안 삼색냥이 앞발을 쾅쾅, 멈추면 팻말에 번호가 샥 -->
        <label class="pk-sound"><input type="checkbox" id="pkCatTheme"> 🐱 고양이</label>
      </span>
      <span class="pk-foot-right">
        <button type="button" class="btn btn-sm btn-ghost" id="pkNumsBtn">✏️ 번호 명단</button>
        <button type="button" class="btn btn-sm btn-ghost" id="pkResetBtn">새 바퀴</button>
      </span>
    </div>
    <!-- v130 — 실제 학급 번호 고치기(전출로 빈 번호 등). 이 컴퓨터에만 저장. -->
    <div class="pk-nums" id="pkNumsBox" hidden>
      <label for="pkNumsInput" class="pk-label">이 반 실제 번호</label>
      <input type="text" id="pkNumsInput" class="pk-nums-input" inputmode="numeric" autocomplete="off" placeholder="1-12, 14, 16-28">
      <p class="pk-nums-note"><span id="pkNumsNote"></span> 빈 번호는 빼고, 쉼표·하이픈(-)으로 적어요. 이 컴퓨터에만 저장돼요.</p>
      <div class="pk-nums-actions">
        <button type="button" class="btn btn-sm" id="pkNumsSave">저장</button>
        <button type="button" class="btn btn-sm btn-ghost" id="pkNumsReset">기본 명단으로</button>
        <button type="button" class="btn btn-sm btn-ghost" id="pkNumsCancel">취소</button>
      </div>
    </div>
  </section>

  <section class="pk-card pk-today-card">
    <h2 class="pk-sub">오늘 발표</h2>
    <p class="pk-today" id="pkToday"></p>
    <button type="button" class="btn btn-sm btn-ghost" id="pkCopy" hidden>📋 복사</button>
  </section>

  <p class="pk-back"><a href="./">← 역사 탐구 기록으로</a></p>
</main>

<div class="pk-stage" id="pkStage" hidden>
  <div class="pk-stage-inner" role="dialog" aria-modal="true" aria-label="발표자 뽑기 결과" aria-live="polite">
    <p class="pk-stage-class" id="pkStageClass"></p>
    <!-- v129 — 고양이 테마일 때만 보인다. 그림은 힉스필드로 만든 삼색냥(wish_list 마스코트와 같은 캐릭터) 세 동작. -->
    <div class="pk-cat" id="pkCat" aria-hidden="true">
      <img id="pkCatImg" src="images/cat/cat-up.jpg" alt="" width="400" height="400">
      <span class="pk-cat-sign" id="pkCatSign"></span>
      <span class="pk-cat-fx" id="pkCatFx">샥!</span>
    </div>
    <div class="pk-reels">
      <span class="pk-reel" id="pkReel0">0</span><span class="pk-reel" id="pkReel1">0</span><span class="pk-unit">번</span>
    </div>
    <p class="pk-hint" id="pkHint"></p>
    <p class="pk-result" id="pkResult"></p>
    <div class="pk-actions" id="pkActions" hidden>
      <button type="button" class="btn" id="pkAgainBtn">한 명 더</button>
      <button type="button" class="btn btn-ghost" id="pkCloseBtn">닫기</button>
    </div>
  </div>
</div>
<div class="pk-toast" id="pkToast" role="status"></div>

<script src="config.js?v=133"></script>
<script src="js/picker.js?v=130"></script>
</body>
</html>
